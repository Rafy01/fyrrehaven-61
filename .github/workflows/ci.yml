name: CI

on:
  push:
    branches:
      - main
      - stage
      - "feature/**"
  pull_request:

jobs:
  validate:
    name: Lint, build and scan secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Scan tracked files for secrets
        run: npm run secrets:scan
