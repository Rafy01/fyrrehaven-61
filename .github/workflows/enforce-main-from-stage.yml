name: Enforce Main PR Source

on:
  pull_request_target:
    branches:
      - main

jobs:
  enforce-source-branch:
    name: Require stage as PR source
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail if PR into main does not come from stage
        run: |
          if [ "${{ github.head_ref }}" != "stage" ]; then
            echo "Pull requests into main must come from the stage branch."
            echo "Current source branch: ${{ github.head_ref }}"
            exit 1
          fi

          echo "PR source branch is stage. Check passed."
